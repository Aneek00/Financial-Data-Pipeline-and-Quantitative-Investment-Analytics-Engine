name: AMFI Daily Extraction Pipeline

on:
  schedule:
    # Executes at 18:30 UTC daily (Midnight IST), ensuring AMFI has published the day's data
    - cron: '30 18 * * *'
  workflow_dispatch: # Allows manual triggering from the GitHub UI for testing

jobs:
  extract-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install pandas requests pyarrow

      - name: Execute Daily Scraper
        run: python sandbox/daily_extract.py

      - name: Upload Parquet Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-nav-data
          path: '*.parquet'
          retention-days: 90 # Holds the files in the cloud for 3 months